
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
   <style>
    *{
    margin: 0;

}
h1{
    background-color: #081b31;

}

 display: flex;

    background-color: #081b31;

</head>
<body>
<h1>ROCK PAPER SCISSOR</h1>
<div cLass="choices">
    <div class="choice" id="rock">
        <img src="rock.png">
    </div>
    <div class="choice" id="paper">
        <img src="paper.png">
    </div>
    <div class="choice" id="scissor">
        <img src="scissors.png">
    </div>
</div>

<div class="score_board">
    <div class="score">
<p id="user_score">0</p>
<p>You</p>
    </div>

     <div class="score">
<p id="comp_score">0</p>
<p>Computer</p>
    </div>
</div>

<div class="msg_container">
    <p id="msg">Play your move</p>
</div>


<script>
    let userscore=0;
let compscore=0;

const choice= document.querySelectorAll(".choice");
const msg= document.querySelector("#msg");
const userScorePera= document.querySelector("#user_score");
const compScorePera= document.querySelector("#comp_score");



const getCompChoice = ()=> {
   const options=["rock" ,"paper", "scissor" ];
   const randIDX= Math.floor(Math.random()*3);
   return options[randIDX];
};

const drawGame=()=>{
  console.log("Game was draw, try again.");
  msg.innerText= "Game was Draw. Try again";
  msg.style.backgroundColor = "black";
};

const playgame = (userchoice)=> {
    console.log("userchoice=", userchoice);
    //Generate computer choice
    const compChoice= getCompChoice();
     console.log("Computer choice=", compChoice);

     if(userchoice== compChoice){
       drawGame();
     }else{
        let userwin= true;
        if(userchoice== "rock"){
            //paper, scissor
            userwin= compChoice=="paper" ? false : true;
        }
        else if(userchoice== "paper"){
            //paper, scissor
            userwin= compChoice=="scissor" ? false : true;
     }
     else{ 
        userwin= compChoice=="rock" ? false : true;
     }

     const showWinner= (userwin, userchoice, compChoice)=>{
        if(userwin){
            userscore++;
            userScorePera.innerText= userscore;
            console.log("You win");
            msg.innerText= `You win! your ${userchoice} beats ${compChoice}`;
             msg.style.backgroundColor="green";
        }
        else{
            compscore++;
            compScorePera.innerText= compscore;
             console.log("You lose");
            msg.innerText= "You lose", msg.innerText= `You lose! ${compChoice} beats your ${userchoice}`;
            msg.style.backgroundColor="red";

        }
     };
     showWinner(userwin, userchoice, compChoice);
    }

}; 
choice.forEach((choice)=> {
    console.log(choice);
    choice.addEventListener("click", () =>{
        const userchoice= choice.getAttribute("id");
       // console.log("Choice was clicked", userchoice);
       playgame(userchoice);

    });
});

</script>

</body>
